apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo
resources:
  - ../../base

# El bump de versión se hace aquí: cambia newTag y ArgoCD sincroniza el deploy.
images:
  - name: ghcr.io/OWNER/REPO
    newName: ghcr.io/OWNER/REPO
    newTag: "REEMPLAZAR_CON_SHA"

replicas:
  - name: app
    count: 3
